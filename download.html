<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>앱 다운로드</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at top, rgba(255, 123, 114, 0.14), transparent 28%),
        linear-gradient(180deg, #0b0d14 0%, #12131a 100%);
      color: #f4f7ff;
    }
    .page {
      width: min(100%, 760px);
      padding: 28px;
      border-radius: 24px;
      background: rgba(17, 21, 31, 0.96);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 2.2vw, 2.6rem);
    }
    p {
      color: #c5d0ff;
      line-height: 1.7;
    }
    .badge {
      display: inline-flex;
      gap: 8px;
      margin-top: 14px;
      padding: 11px 16px;
      border-radius: 999px;
      background: rgba(255, 123, 114, 0.18);
      color: #ffd9c4;
      font-size: 0.98rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      background: #ff7b72;
      border: 1px solid transparent;
      transition: background 150ms ease, transform 150ms ease, border-color 150ms ease;
    }
    a.button:hover {
      background: #ff8f84;
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.12);
    }
    a.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5ff;
    }
    .note {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #d8e0ff;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>기기별 앱 다운로드</h1>
    <p>이 페이지에 접속한 기기를 인식하고, 가장 적합한 다운로드 링크를 제공합니다. Android, Windows, macOS 등의 기기에서 바로 설치 파일로 이동할 수 있습니다.</p>
    <p>실제 설치 파일은 웹 서버의 <code>/downloads</code> 폴더에 올려 두어야 합니다.</p>

    <div class="badge" id="detectedDevice">기기 감지 중...</div>

    <div class="buttons" id="downloadButtons">
      <a class="button" id="mainButton" href="#">다운로드 준비 중...</a>
      <a class="button secondary hidden" id="fallbackWindows" href="./downloads/subculture-calendar-setup.exe">Windows용 .exe</a>
      <a class="button secondary hidden" id="fallbackAndroid" href="./downloads/subculture-calendar.apk">Android용 .apk</a>
      <a class="button secondary hidden" id="fallbackIos" href="./ios-download">iOS 안내</a>
    </div>

    <div class="note" id="noteText">기기 인식이 실패하면 아래 버튼을 사용하세요.</div>
  </div>

  <script>
    const origin = window.location.origin || (window.location.protocol + '//' + window.location.host);
    const basePath = window.location.pathname.replace(/\/[^\/]*$/, '/');
    const downloadLinks = {
      windows: origin + basePath + 'downloads/subculture-calendar-setup.exe',
      android: origin + basePath + 'downloads/subculture-calendar.apk',
      macos: origin + basePath + 'downloads/subculture-calendar.dmg',
    };

    function getDeviceInfo() {
      const ua = navigator.userAgent || '';
      const lower = ua.toLowerCase();

      if (/android/.test(lower)) return 'android';
      if (/iphone|ipad|ipod/.test(lower)) return 'ios';
      if (/windows/.test(lower)) return 'windows';
      if (/macintosh|mac os x/.test(lower)) return 'macos';
      if (/linux/.test(lower)) return 'linux';
      return 'unknown';
    }

    function updateUi(device) {
      const detected = document.getElementById('detectedDevice');
      const mainButton = document.getElementById('mainButton');
      const fallbackWindows = document.getElementById('fallbackWindows');
      const fallbackAndroid = document.getElementById('fallbackAndroid');
      const fallbackIos = document.getElementById('fallbackIos');
      const noteText = document.getElementById('noteText');

      detected.textContent = `감지된 기기: ${device}`;
      fallbackWindows.href = downloadLinks.windows;
      fallbackAndroid.href = downloadLinks.android;
      fallbackIos.href = '#';
      fallbackIos.classList.add('hidden');

      fallbackWindows.classList.remove('hidden');
      fallbackAndroid.classList.remove('hidden');

      if (device === 'android') {
        mainButton.textContent = 'Android APK 다운로드';
        mainButton.href = downloadLinks.android;
      } else if (device === 'windows') {
        mainButton.textContent = 'Windows 설치 프로그램 다운로드';
        mainButton.href = downloadLinks.windows;
      } else if (device === 'macos') {
        mainButton.textContent = 'macOS 설치 파일 다운로드';
        mainButton.href = downloadLinks.macos;
      } else {
        mainButton.textContent = 'Android / Windows 다운로드 보기';
        mainButton.href = '#downloadButtons';
      }

      noteText.textContent = '카톡, 디스코드로 공유한 링크에서도 이 페이지를 열어 설치할 수 있습니다. 아래 버튼을 눌러 주세요.';
    }

    const device = getDeviceInfo();
    updateUi(device);
  </script>
</body>
</html>
